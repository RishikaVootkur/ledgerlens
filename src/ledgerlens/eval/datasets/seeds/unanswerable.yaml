# Handwritten unanswerable questions. The corpus is, per universe company, the latest 10-K
# and two latest 10-Qs (filed up to 2026-11-01), plus the FinanceBench source documents.
# Every question below must stay unanswerable from that corpus. `why` explains the reason
# and is copied to metadata. Keep ids stable: append new entries, never renumber.
#
# Categories (question_type):
#   future_period          period after the newest filing in the corpus
#   not_in_corpus_company  real company outside the universe and outside FinanceBench
#   not_disclosed          something SEC filings never contain
#   wrong_form_or_period   a period older than any ingested filing for that company
#   false_premise          a segment, product or event the company does not have
#   nonfinancial_trivia    company-adjacent trivia that filings do not cover

