[project]
name = "ledgerlens"
version = "0.1.0"
description = "Agentic research analyst over SEC filings with citations, plus an LLM evaluation lab"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rishika Vootkur" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "typer>=0.27",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ledgerlens"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs network, Docker services or Ollama (skipped in CI)",
]

[tool.coverage.run]
source = ["ledgerlens"]
branch = true
