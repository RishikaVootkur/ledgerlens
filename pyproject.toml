[project]
name = "ledgerlens"
version = "0.1.0"
description = "Agentic research analyst over SEC filings with citations, plus an LLM evaluation lab"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rishika Vootkur" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "typer>=0.27",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "litellm>=1.106",
    "tenacity>=9.2",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "pymupdf>=2.0",
    "qdrant-client>=1.20",
    "bm25s>=0.3",
    "fastembed>=0.9",
    "numpy>=2.3",
    "scipy>=1.16",
    "huggingface-hub>=1.33.0",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "mcp>=2.3",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sse-starlette>=3.6",
    "arize-phoenix-otel>=0.17",
    "opentelemetry-sdk>=1.45",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "types-pyyaml",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ledgerlens"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs network, Docker services or Ollama (skipped in CI)",
]

[tool.coverage.run]
source = ["ledgerlens"]
branch = true

# Third-party packages that ship without type information.
[[tool.mypy.overrides]]
module = ["bm25s.*", "fastembed.*", "fitz.*", "pymupdf.*", "litellm.*", "lxml.*", "sse_starlette.*", "phoenix.*", "scipy.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
