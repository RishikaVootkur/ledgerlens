name: eval-gate

# Replays the CI slice of the eval from the committed response cache (eval/cache):
# deterministic, free and keyless. Fails when any gated metric drops past its
# threshold in eval/gate.yaml, and posts the metric diff as a PR comment.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: replay
      CACHE_DIR: /tmp/ledgerlens-empty-cache
      SEC_USER_AGENT: "LedgerLens CI ci@ledgerlens.invalid"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

      - name: Replay the CI slice
        id: replay
        continue-on-error: true
        run: |
          uv run ledgerlens eval run --config eval/configs/ci_slice.yaml --split dev \
            --run-id ci-slice-candidate --out "$RUNNER_TEMP/candidate.json"

      - name: Gate against the committed baseline
        id: gate
        if: steps.replay.outcome == 'success'
        run: |
          set +e
          uv run ledgerlens eval gate --baseline eval/baselines/ci_slice.json \
            --candidate "$RUNNER_TEMP/candidate.json" --markdown-out "$RUNNER_TEMP/gate.md"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Post or update the gate comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/gate.md"
          marker="<!-- ledgerlens-eval-gate -->"
          if [ ! -f "$body" ]; then
            printf '%s\n## LedgerLens eval gate: ERROR\n\nThe replay crashed before the gate ran (often a cache miss after a prompt or tool change: re-record the slice). See the workflow logs.\n' "$marker" > "$body"
          fi
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR" --body-file "$body"
          fi

      - name: Fail if the replay or the gate failed
        if: steps.replay.outcome != 'success' || steps.gate.outputs.exit != '0'
        run: exit 1
