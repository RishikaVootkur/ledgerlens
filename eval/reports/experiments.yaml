# Which runs the eval dashboard shows and how they are grouped. Every row points at a
# committed run file in eval/runs/. Deltas and p-values are paired comparisons against
# each table's baseline row (Holm-adjusted across the metrics of that comparison).

headline:
  run_id: final-test-v2
  title: "Held-out test subsample (120 questions): Gemini 3.5 Flash-Lite, hybrid retrieval, all four fixes"
  metrics: [numeric_correct, judge_correct, refusal_correct, citation_precision, citation_recall, model_latency_p50_ms, cost_usd_mean]

tables:
  - id: ablation-retrieval
    title: "Retrieval methods (FinanceBench dev, section chunks)"
    description: "LLM-free: each FinanceBench dev question is run against its own document and scored against the human-labeled evidence pages."
    baseline: BM25
    columns: [recall_at_10, recall_at_5, mrr, ndcg_at_10]
    rows:
      - {name: "BM25", run_id: retrieval-bm25-section-dev}
      - {name: "Dense (nomic-embed-text)", run_id: retrieval-dense-section-dev}
      - {name: "Hybrid (RRF)", run_id: retrieval-hybrid-section-dev}
      - {name: "Hybrid + cross-encoder rerank", run_id: retrieval-hybrid_rerank-section-dev}

  - id: ablation-chunking
    title: "Chunking strategy (FinanceBench dev)"
    description: "Section- and table-aware chunks vs fixed 512-token chunks, same retrieval methods. Fixed chunks are about twice as long on average, so each hit covers more of a labeled page."
    baseline: "Section, hybrid"
    columns: [recall_at_10, recall_at_5, mrr, ndcg_at_10]
    rows:
      - {name: "Section, hybrid", run_id: retrieval-hybrid-section-dev}
      - {name: "Fixed, hybrid", run_id: retrieval-hybrid-fixed-dev}
      - {name: "Section, dense", run_id: retrieval-dense-section-dev}
      - {name: "Fixed, dense", run_id: retrieval-dense-fixed-dev}
      - {name: "Section, BM25", run_id: retrieval-bm25-section-dev}
      - {name: "Fixed, BM25", run_id: retrieval-bm25-fixed-dev}

  - id: ablation-agent
    title: "Agent components (62-question dev slice)"
    description: "Gemini 3.5 Flash-Lite. Removing the XBRL facts tool, or the number verification and citation self-check."
    baseline: Full agent
    columns: [numeric_correct, judge_correct, refusal_correct, tokens_mean]
    rows:
      - {name: "Full agent", run_id: ablation_no_statement_search-dev}
      - {name: "Without XBRL facts tool", run_id: ablation_no_xbrl-dev}
      - {name: "Without verification and self-check", run_id: ablation_no_checks-dev}

  - id: error-fixes
    title: "Targeted fixes from error analysis (62-question dev slice)"
    description: "Each row turns one fix off (these runs predate fix 4). Deltas are the cost of removing that fix."
    baseline: Fixes 1-3
    columns: [numeric_correct, judge_correct, refusal_correct, tokens_mean]
    rows:
      - {name: "Fixes 1-3", run_id: ablation_no_statement_search-dev}
      - {name: "Without fix 1: repeated tool calls", run_id: ablation_no_dedupe-dev}
      - {name: "Without fix 2: derived numbers", run_id: ablation_no_derive-dev}
      - {name: "Without fix 3: grouped citation markers", run_id: ablation_no_group_split-dev}

  - id: fix4-dev
    title: "Fix 4: statement-aware retrieval (62-question dev slice)"
    description: "Built after the first held-out run to address FinanceBench false refusals; developed on dev only."
    baseline: Before fix 4
    columns: [numeric_correct, judge_correct, refusal_correct, recall_at_10, tokens_mean]
    rows:
      - {name: "Before fix 4", run_id: ablation_no_statement_search-dev}
      - {name: "With fix 4", run_id: ablation_default-dev}

  - id: fix4-test
    title: "Fix 4 on the held-out test subsample (120 questions)"
    description: "The test split was run once before fix 4 and once after; both runs are shown."
    baseline: Before fix 4
    columns: [numeric_correct, judge_correct, refusal_correct, recall_at_10, citation_recall]
    rows:
      - {name: "Before fix 4", run_id: final-test}
      - {name: "With fix 4", run_id: final-test-v2}

  - id: model-comparison
    title: "Models (20-question smoke slice)"
    description: "Same agent and settings (dedupe off, as when the Groq run was recorded for the first CI baseline). Local model latency is measured on a laptop GPU shared with other jobs."
    baseline: Qwen3.8 27B (Groq)
    columns: [numeric_correct, refusal_correct, model_latency_p50_ms, tokens_mean, cost_usd_mean]
    rows:
      - {name: "Qwen3.8 27B (Groq)", run_id: model-groq-qwen3.8-27b-smoke}
      - {name: "Gemini 3.5 Flash-Lite", run_id: model_flash_lite_smoke-dev}
      - {name: "Qwen3 8B (local Ollama)", run_id: model-ollama-qwen3-8b-smoke}

failures_from: [final-test-v2]
max_failure_examples: 30
judge_calibration: eval/reports/judge_calibration_groq-gpt-oss-120b_test.json
